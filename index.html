<style>
:root{--bg:#fff;--card:#f1f3f4;--card2:#e4e8ea;--ink:#0a0a0a;--mute:#7d8991;--dot:#98a2a8;--cy:#0dc0e0;--on:#04222a;--vf:#c8d0d8;
--hd:'Sora',system-ui,sans-serif;--bd:'DM Sans',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f12;--card:#151b1f;--card2:#1f272c;--ink:#f2f6f7;--mute:#8b979e;--dot:#5d6a71;--vf:#1d262c}}
:root[data-theme="dark"]{--bg:#0b0f12;--card:#151b1f;--card2:#1f272c;--ink:#f2f6f7;--mute:#8b979e;--dot:#5d6a71;--vf:#1d262c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--bd);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,textarea{font:inherit;color:inherit}
button{border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:0 20px 120px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font:800 22px var(--hd);letter-spacing:-.03em}
.brand svg{width:34px;height:34px}
.acct{width:44px;height:44px;border-radius:50%;background:var(--cy);display:grid;place-items:center}
.acct svg{width:24px;height:24px}
/* viewfinder */
.vf{position:relative;width:300px;height:260px;margin:44px auto 36px}
.vf>svg{position:absolute;inset:0;width:100%;height:100%}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:polygon(50% 0,100% 100%,0 100%);display:none}
.vf.on video{display:block}
.scanhint{position:absolute;left:0;right:0;bottom:38px;text-align:center;font:500 14px var(--bd);color:var(--mute);background:none}
.vf.on .scanhint{display:none}
.edge{position:absolute;width:158px;height:42px;margin:-21px 0 0 -79px;border-radius:21px;background:var(--card2);color:var(--mute);font:700 15px var(--hd);display:grid;place-items:center;transition:background .15s,color .15s}
.edge:hover{background:var(--cy);color:var(--on)}
.edge.l{left:51px;top:116px;transform:rotate(-60deg)}
.edge.r{left:249px;top:116px;transform:rotate(60deg)}
/* tabs */
.seg{display:flex;background:var(--card);border-radius:24px;padding:5px;margin:0 0 20px}
.seg button{flex:1;padding:10px;border-radius:19px;background:none;font:700 15px var(--hd);color:var(--mute)}
.seg button[aria-selected=true]{background:var(--card2);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--card);border-radius:26px;padding:16px 14px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.tile .tri{width:100%;max-width:150px}
.code{font:700 12px var(--hd);letter-spacing:.14em;color:var(--mute)}
.row{display:flex;gap:8px;width:100%;margin-top:6px}
.pill{flex:1;min-width:0;height:42px;border-radius:21px;background:var(--card2);color:var(--mute);font:700 15px var(--hd);padding:0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{width:42px;height:42px;border-radius:50%;background:var(--cy);display:grid;place-items:center;flex:none}
.go svg{width:20px;height:20px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:28px 10px}
.fab{position:fixed;left:max(20px,calc(50% - 280px));bottom:calc(20px + env(safe-area-inset-bottom,0px));height:56px;border-radius:28px;background:var(--cy);color:var(--on);font:800 17px var(--hd);display:flex;align-items:center;gap:10px;padding:0 22px 0 18px;box-shadow:0 6px 20px rgba(13,192,224,.35);z-index:6}
.fab svg{width:22px;height:22px}
/* sheet */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#ov.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:32px 32px 0 0;padding:22px 22px calc(26px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
@media(min-width:700px){#ov{align-items:center}.sheet{border-radius:32px}}
.sheet h2{font:800 28px var(--hd);letter-spacing:-.03em;margin:0 0 16px}
.big{width:100%;border:0;background:var(--card);border-radius:26px;padding:20px 24px;font:800 40px var(--hd);letter-spacing:.08em;margin-bottom:12px}
.big::placeholder{color:var(--card2)}
.in{width:100%;border:0;background:var(--card);border-radius:20px;padding:14px 18px;margin-bottom:10px}
textarea.in{min-height:110px;resize:vertical}
.btn{height:50px;border-radius:25px;padding:0 26px;background:var(--cy);color:var(--on);font:800 16px var(--hd)}
.btn.g{background:var(--card2);color:var(--ink)}
.btns{display:flex;gap:10px;margin-top:10px}.btns .btn{flex:1}
.tri{display:block;width:100%}
.media{background:var(--card);border-radius:22px;padding:16px 18px;margin:12px 0;word-break:break-word}
.media img{max-width:100%;border-radius:14px;display:block}
.media small{color:var(--mute);display:block}
.chk{display:flex;gap:10px;align-items:center;color:var(--mute);margin:4px 0 6px}
.note{color:var(--mute);font-size:14px;margin:4px 0 12px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.show{opacity:1}
.stat{text-align:center;color:var(--mute);font-size:14px;margin:-18px 0 22px;min-height:20px}
.right,.deskin{display:none}
.dh{font:800 40px var(--hd);letter-spacing:-.035em;margin:0 0 14px}
.pair{text-align:center}.pair .tri{max-width:340px;margin:0 auto}
#panel{min-height:260px;background:var(--card);border-radius:34px;padding:28px;display:grid;place-items:center;margin-top:24px;font:800 48px var(--hd);color:var(--card2);letter-spacing:-.03em}
#panel.has{display:block;font:400 16px var(--bd);color:var(--ink);letter-spacing:0}
#panel .media{background:var(--bg)}
@media(min-width:900px){main{max-width:1120px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;margin-top:40px}.vf,.stat{display:none}.right{display:block;position:sticky;top:96px}.deskin{display:block}.fab{left:max(20px,calc(50% - 540px))}}
.guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none;fill:none;stroke:var(--cy);stroke-width:3;stroke-dasharray:5 6;stroke-linejoin:round}
.guide path{stroke-width:2;opacity:.5}
.vf.on .guide{display:block}
.vf.lk .guide{stroke-dasharray:none}.vf.lk .guide path{opacity:.9}
</style>

<body>
<main>
<header>
 <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,17 83,77 17,77" fill="none" stroke="#0dc0e0" stroke-width="13" stroke-linejoin="round"/><circle cx="50" cy="55" r="9" fill="#0dc0e0"/></svg>Deltacode</div>
 <button class="acct" id="acct" aria-label="Account"><svg viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.6-7 8-7s8 2.5 8 7z"/></svg></button>
</header>

<div class='cols'><div class='left'>
<div class='deskin'><h2 class='dh'>Enter a code</h2><input class='big' id='dci' inputmode='numeric' maxlength='6' placeholder='123456' autocomplete='off' aria-label='Enter a code'></div>
<div class="vf" id="vf">
 <svg viewBox="0 0 300 260" aria-hidden="true"><polygon points="150,22 278,238 22,238" fill="var(--vf)" stroke="var(--vf)" stroke-width="36" stroke-linejoin="round"/></svg>
 <video id="cam" playsinline muted></video>
 <svg class="guide" viewBox="0 0 300 260" aria-hidden="true"><path d="M150 15.6L285 243H15Z"/><circle cx="150" cy="15.6" r="15"/><circle cx="15" cy="243" r="15"/><circle cx="285" cy="243" r="15"/></svg>
 <button class="scanhint" id="scan">Tap to scan</button>
 <button class="edge l" id="eUser">username</button>
 <button class="edge r" id="eCode">code</button>
</div>

<p class='stat' id='stat'></p>
<div class="seg" role="tablist"><button role="tab" id="tScanned" aria-selected="true">scanned</button><button role="tab" id="tMade" aria-selected="false">made</button></div>
<div class="grid" id="grid"></div></div>
<aside class='right'><div class='pair'><div id='pairTri'></div><p class='note' id='pst'>Scan this with your phone, then scan any code. It opens here.</p></div><div id='panel'>media here</div></aside></div>
</main>

<button class="fab" id="new"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>New</button>
<div id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast"></div>

<script>window.FIREBASE_CONFIG={databaseURL:'https://deltacodecx-default-rtdb.firebaseio.com',apiKey:'AIzaSyAOTn7MnJNxZgzW_pbGraogu-s4uY37OnM'};</script>
<script>
const $=s=>document.querySelector(s);
/* ---- code geometry: 6 dots, 9 edges, 5 styles => 5^9 > 10^6 so every 6-digit code is unique ---- */
const P=[[100,12],[62,76],[138,76],[24,140],[100,140],[176,140]];
const E=[[0,1],[0,2],[1,2],[1,3],[1,4],[2,4],[2,5],[3,4],[4,5]];
const styles=c=>{let n=+c,a=[];for(let i=0;i<9;i++){a.push(n%5);n=Math.floor(n/5)}return a};
function ln(a,b,t,w=9){
 if(t==4)return'';
 const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy,ny=ux,g=13;
 const A=[a[0]+ux*g,a[1]+uy*g],B=[b[0]-ux*g,b[1]-uy*g];
 const S=`stroke="var(--ink)" fill="none" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
 const mx=B[0]-A[0],my=B[1]-A[1];
 if(t==0)return`<path d="M${A}L${B}" ${S}/>`;
 if(t==1)return`<path d="M${A}C${A[0]+mx*.3+nx*16},${A[1]+my*.3+ny*16} ${B[0]-mx*.3-nx*16},${B[1]-my*.3-ny*16} ${B}" ${S}/>`;
 if(t==2){let o='';for(let i=0;i<4;i++)o+=`<circle cx="${A[0]+mx*i/3}" cy="${A[1]+my*i/3}" r="${w*.51}" fill="var(--ink)"/>`;return o}
 let d=`M${A}`;
 if(Math.abs(dy)<1)for(let i=0;i<4;i++)d+=`H${A[0]+mx*(i+1)/4}V${A[1]+(i%2?0:-6)}`;
 else for(let i=1;i<=4;i++)d+=`H${A[0]+mx*i/4}V${A[1]+my*i/4}`;
 return`<path d="${d}" ${S.replace('9','8')}/>`;
}
function tri(c){let o='<svg viewBox="0 0 200 156" class="tri" role="img" aria-label="Code '+c+'">';
 P.forEach(p=>o+=`<circle cx="${p[0]}" cy="${p[1]}" r="8" fill="var(--dot)"/>`);
 styles(c).forEach((s,i)=>o+=ln(P[E[i][0]],P[E[i][1]],s));return o+'</svg>'}

/* ---- storage adapter: browser cache now; swap get/set for Firebase when signed in ---- */
const store={
 get(k){try{return JSON.parse(localStorage.getItem('dc_'+k))||{}}catch(e){return{}}},
 set(k,v){try{localStorage.setItem('dc_'+k,JSON.stringify(v));return true}catch(e){toast('Storage is full');return false}}
};
let tab='scanned';
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),2200)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};
const ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>';

function render(){
 $('#tScanned').setAttribute('aria-selected',tab=='scanned');$('#tMade').setAttribute('aria-selected',tab=='made');
 const d=store.get(tab),ks=Object.keys(d).sort((a,b)=>d[b].t-d[a].t);
 $('#grid').innerHTML=ks.length?ks.map(c=>tile(c,d[c])).join(''):
  `<div class="empty">${tab=='made'?'Nothing made yet. Tap New to create your first code.':'No scanned codes yet. Scan one or type its code.'}</div>`;
}
$('#grid').onclick=e=>{const b=e.target.closest('[data-o]');if(b)openCode(b.dataset.o)};
$('#tScanned').onclick=()=>{tab='scanned';render()};$('#tMade').onclick=()=>{tab='made';render()};

/* ---- sheet ---- */
const ov=$('#ov'),sh=$('#sheet');
function sheet(h){sh.innerHTML=h;ov.classList.add('show');const f=sh.querySelector('input,textarea');f&&setTimeout(()=>f.focus(),50)}
function close(){ov.classList.remove('show');sh.innerHTML='';if(location.hash)history.replaceState(null,'',location.pathname+location.search)}
ov.onclick=e=>{if(e.target===ov)close()};
addEventListener('keydown',e=>{if(e.key=='Escape')close()});

async function openCode(c,fromEntry,remote,ri){
 const m=store.get('made'),s=store.get('scanned');let i=remote?ri:(m[c]||s[c]||await cloud.get(c));
 if(!remote&&i&&!m[c]){s[c]=Object.assign(s[c]||i,{t:Date.now()});store.set('scanned',s);if(auth.u&&base)db(`users/${auth.u.uid}/scanned/${c}`,'PUT',true).catch(()=>{})}
 let med=`<div class="media">No media for this code on this device yet.<small>Codes you make here open on the device that made them until accounts are connected.</small></div>`,main='';
 if(i){
  if(i.type=='url'){med=`<div class="media"><small>Link</small>${esc(i.val)}</div>`;main=`<button class="btn" id="open">Open link</button>`}
  else if(i.type=='img')med=`<div class="media"><img src="${i.val}" alt="${esc(i.title||'Shared image')}"></div>`;
  else med=`<div class="media">${esc(i.val).replace(/\n/g,'<br>')}</div>`;
 }
 show(`<div style="max-width:280px;margin:0 auto">${tri(c)}</div><div class="code" style="text-align:center;font-size:18px;margin:4px 0 10px">${c.slice(0,3)} ${c.slice(3)}</div>${med}<p class="note" id="cd"></p><div class="btns">${main}<button class="btn g" id="share">Share</button></div>`);
 if(main)$('#open').onclick=()=>window.open(i.val,'_blank','noopener');
 $('#share').onclick=async()=>{const u=location.href.split('#')[0]+'#'+c;
  try{if(navigator.share){await navigator.share({title:'Deltacode '+c,text:'Open this Deltacode',url:u});return}}catch(e){if(e.name=='AbortError')return}
  try{await navigator.clipboard.writeText(u);toast('Link copied')}catch(e){toast('Copy this: '+u)}};
 if(remote&&i&&i.type=='url')redirect(i.val);
 if(!fromEntry&&!remote)try{history.replaceState(null,'','#'+c)}catch(e){}
}

/* ---- enter code ---- */
$('#eCode').onclick=()=>{
 sheet(`<h2>Enter a code</h2><div id="pv" style="max-width:220px;margin:0 auto 8px">${tri('000000')}</div><input class="big" id="ci" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="off"><div class="btns"><button class="btn" id="go">Open code</button></div>`);
 const ci=$('#ci');ci.oninput=()=>{ci.value=ci.value.replace(/\D/g,'');if(ci.value.length==6)$('#pv').innerHTML=tri(ci.value)};
 const go=()=>ci.value.length==6?openCode(ci.value,1):toast('Codes have 6 digits');
 $('#go').onclick=go;ci.onkeydown=e=>{if(e.key=='Enter')go()};
};
$('#eUser').onclick=()=>{
 sheet(`<h2>See public codes</h2><input class="in" id="un" placeholder="username" autocapitalize="none" autocomplete="off"><p class="note">Type a username to see the public codes on that account.</p><div class="btns"><button class="btn" id="ug">Look up</button></div>`);
 const ug=()=>userPage($('#un').value);$('#ug').onclick=ug;$('#un').onkeydown=e=>{if(e.key=='Enter')ug()};
};
$('#acct').onclick=accountSheet;

/* ---- new code ---- */
let kind='url';
$('#new').onclick=()=>{kind='url';newSheet()};
function newSheet(){
 sheet(`<h2>New code</h2><div class="seg" role="tablist">${['url','text','img'].map(k=>`<button role="tab" data-k="${k}" aria-selected="${k==kind}">${{url:'link',text:'text',img:'image'}[k]}</button>`).join('')}</div>
 ${kind=='url'?'<input class="in" id="v" type="url" placeholder="https://" autocapitalize="none">':kind=='text'?'<textarea class="in" id="v" placeholder="Write a message"></textarea>':'<input class="in" id="v" type="file" accept="image/*">'}
 <input class="in" id="ti" placeholder="Name (optional)" maxlength="40"><label class="chk"><input type="checkbox" id="pub" ${auth.u?'':'disabled'}> ${auth.u?'List on my public page':'Sign in to list publicly'}</label>
 <div class="btns"><button class="btn" id="mk">Make code</button></div>`);
 sh.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{kind=b.dataset.k;newSheet()});
 $('#mk').onclick=async()=>{
  const v=$('#v');let val=kind=='img'?await shrink(v.files[0]):v.value.trim();
  if(!val)return toast(kind=='img'?'Choose an image':'Add something to share');
  if(kind=='url'&&!/^https?:\/\//i.test(val))val='https://'+val;
  const m=store.get('made');let c,n=0;const free=async x=>{if(m[x]||styles(x).filter(s=>s<4).length<5||await cloud.get(x))return false;const al=await altCodes(x);return al.includes(x)&&!(await Promise.all(al.filter(r=>r!=x).map(r=>m[r]||cloud.get(r)))).some(Boolean)};do{c=String(Math.random()*1e6|0).padStart(6,'0')}while(!(await free(c))&&++n<40);
  const it={type:kind,val,title:$('#ti').value.trim(),pub:$('#pub').checked,t:Date.now()};
  if(auth.u){it.owner=auth.u.uid;it.user=auth.u.name}
  if(!await cloud.put(c,it))toast('Saved on this device only');
  m[c]=it;if(store.set('made',m)){mine(c,it);tab='made';render();openCode(c,1)}
 };
}
function shrink(f){return new Promise(r=>{if(!f)return r('');const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};i.onerror=()=>r('');i.src=u})}

/* ---- cloud + device link: Firebase Realtime DB (REST/SSE) when window.FIREBASE_CONFIG.databaseURL is set, else tabs of the same browser ---- */
const DB=(window.FIREBASE_CONFIG||{}).databaseURL,base=DB&&DB.replace(/\/$/,'');
async function db(p,method,body){const t=await auth.token();const r=await fetch(`${base}/${p}.json${t?'?auth='+t:''}`,{method:method||'GET',body:body==null?undefined:JSON.stringify(body)});if(!r.ok)throw new Error(r.status);return r.json()}
const cloud={
 async get(c){if(!base)return null;try{return await db('codes/'+c)}catch(e){return null}},
 async put(c,i){if(!base)return true;try{await db('codes/'+c,'PUT',i);return true}catch(e){return false}}
};

/* ---- accounts: Firebase Auth over REST. A username becomes the email name@deltacode.invalid, so there is no password recovery ---- */
const KEY=(window.FIREBASE_CONFIG||{}).apiKey;
const auth={u:null,
 async req(url,body){const f=body instanceof URLSearchParams;const r=await fetch(url,{method:'POST',headers:{'Content-Type':f?'application/x-www-form-urlencoded':'application/json'},body:f?body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error((d.error&&d.error.message)||'FAILED');return d},
 save(d,name){this.u={uid:d.localId||d.user_id,name,idToken:d.idToken||d.id_token,refresh:d.refreshToken||d.refresh_token,exp:Date.now()+(+(d.expiresIn||d.expires_in)-60)*1e3};store.set('auth',this.u)},
 async enter(n,pw,create){
  if(create&&await db('usernames/'+n).catch(()=>null))throw new Error('USERNAME_TAKEN');
  const d=await this.req(`https://identitytoolkit.googleapis.com/v1/accounts:${create?'signUp':'signInWithPassword'}?key=${KEY}`,{email:n+'@deltacode.invalid',password:pw,returnSecureToken:true});
  this.save(d,n);if(create)await db('usernames/'+n,'PUT',this.u.uid)},
 async token(){const u=this.u;if(!u)return null;
  if(Date.now()>u.exp){try{this.save(await this.req(`https://securetoken.googleapis.com/v1/token?key=${KEY}`,new URLSearchParams({grant_type:'refresh_token',refresh_token:u.refresh})),u.name)}catch(e){this.out();return null}}
  return this.u.idToken},
 out(){this.u=null;store.set('auth',{})}};
auth.u=(s=>s.uid?s:null)(store.get('auth'));
const nice=m=>({EMAIL_EXISTS:'That username is taken.',USERNAME_TAKEN:'That username is taken.',INVALID_LOGIN_CREDENTIALS:'Wrong username or password.',INVALID_PASSWORD:'Wrong username or password.',EMAIL_NOT_FOUND:'Wrong username or password.',OPERATION_NOT_ALLOWED:'Turn on Email/Password sign-in in Firebase.'}[m]||(m.startsWith('WEAK')?'Password needs 6 or more characters.':'Something went wrong. Try again.'));
function tile(c,i){return`<div class="tile">${tri(c)}<div class="code">${c}</div><div class="row"><button class="pill" data-o="${c}">${i.type=='url'?esc(host(i.val)):esc(i.title||i.type)}</button><button class="go" data-o="${c}" aria-label="Open ${c}">${ARROW}</button></div></div>`}
function mine(c,it){if(!auth.u)return;db(`users/${auth.u.uid}/made/${c}`,'PUT',true).catch(()=>{});if(it.pub)db(`byUser/${auth.u.name}/${c}`,'PUT',true).catch(()=>{})}
async function sync(){if(!auth.u||!base)return;const u=auth.u.uid;try{
 for(const k of ['made','scanned']){const ks=Object.keys(await db(`users/${u}/${k}`)||{}),d=store.get(k);
  await Promise.all(ks.filter(c=>!d[c]).map(async c=>{const it=await cloud.get(c);if(it)d[c]=Object.assign(it,{t:it.t||Date.now()})}));store.set(k,d)}
 render()}catch(e){}}
function accountSheet(){
 if(!base||!KEY)return sheet(`<h2>Account</h2><p class="note">Accounts need Firebase connected: set databaseURL and apiKey in FIREBASE_CONFIG.</p><div class="btns"><button class="btn g" onclick="close()">Close</button></div>`);
 if(auth.u){const n=auth.u.name;
  sheet(`<h2>${esc(n)}</h2><p class="note">Signed in. Your codes sync across devices.</p><div class="btns"><button class="btn" id="cp">Copy public link</button><button class="btn g" id="so">Sign out</button></div>`);
  $('#cp').onclick=async()=>{const u=location.href.split('#')[0]+'#u-'+n;try{await navigator.clipboard.writeText(u);toast('Link copied')}catch(e){toast(u)}};
  $('#so').onclick=()=>{auth.out();close();toast('Signed out')};return}
 sheet(`<h2>Account</h2><input class="in" id="an" placeholder="username" autocapitalize="none" autocomplete="username" maxlength="20"><input class="in" id="ap" type="password" placeholder="password" autocomplete="current-password"><p class="note" id="ae">Usernames are 3 to 20 letters, numbers or hyphens. There is no email, so a lost password can't be recovered.</p><div class="btns"><button class="btn g" id="si">Sign in</button><button class="btn" id="su">Create account</button></div>`);
 const go=async create=>{const n=$('#an').value.trim().toLowerCase(),p=$('#ap').value,e=$('#ae');
  if(!/^[a-z0-9-]{3,20}$/.test(n))return e.textContent='Usernames are 3 to 20 letters, numbers or hyphens.';
  try{e.textContent='One moment…';await auth.enter(n,p,create);close();toast(create?'Account created':'Signed in');sync()}catch(x){e.textContent=nice(x.message)}};
 $('#si').onclick=()=>go(0);$('#su').onclick=()=>go(1);
}
async function userPage(name){
 name=name.toLowerCase().trim();if(!base)return toast('Connect Firebase first');
 let ks,uid;try{uid=await db('usernames/'+name);ks=Object.keys(await db('byUser/'+name)||{})}catch(e){return toast('Could not look that up')}
 if(!uid)return toast('No account with that username');

 let c=cs[0],i=null;
 for(const k of cs){const it=store.get('made')[k]||store.get('scanned')[k]||await cloud.get(k);if(it){c=k;i=it;break}}
 if(pair){if(!i){stat('Code '+c+' does not exist. Scan another.');return}
  navigator.vibrate&&navigator.vibrate(30);link.send(pair,{t:'show',code:c,item:i});stat('Sent '+c+' to your desktop. Scan another.');return}
 if(!i){for(const k of cs)if(await link.probe(k)){pair=k;link.send(k,{t:'paired'});navigator.vibrate&&navigator.vibrate(30);stat('Paired with desktop. Tap here to unpair.');toast('Desktop paired');return}
  stat('Read '+c+' but no such code exists. Keep scanning.');return}
 navigator.vibrate&&navigator.vibrate(30);openCode(c);
}
$('#stat').onclick=()=>{if(pair){pair=null;stat('Unpaired. Point at a code.')}};
$('#scan').onclick=async()=>{
 const v=$('#cam');
 try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60,max:60}}});
  v.srcObject=s;await v.play();
  try{await s.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}}
 catch(e){return toast('Allow camera access in your browser, or type the code.')}
 try{await tpl()}catch(e){return toast('Scanner could not start')}
 $('#vf').classList.add('on');stat('Point at a code');
 const next=f=>v.requestVideoFrameCallback?v.requestVideoFrameCallback(f):requestAnimationFrame(f);
 const loop=()=>{try{step(v)}catch(e){}next(loop)};next(loop);
};

/* ---- open shared links like #123456 ---- */
function hash(){const h=location.hash.slice(1);if(/^\d{6}$/.test(h))openCode(h,1);else if(/^u-[a-z0-9-]{3,20}$/.test(h))userPage(h.slice(2))}
addEventListener('hashchange',hash);render();startDesk();hash();sync();
</script>
